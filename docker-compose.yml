services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - fastapi
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_OFF_API_BASE_URL: ${NEXT_PUBLIC_OFF_API_BASE_URL:-https://world.openfoodfacts.org}
    command: npm run start
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
      NEXT_PUBLIC_OFF_API_BASE_URL: ${NEXT_PUBLIC_OFF_API_BASE_URL:-https://world.openfoodfacts.org}
    depends_on:
      - fastapi
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    expose:
      - "8000"
    environment:
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      MONGO_DB_NAME: ${MONGO_DB_NAME:?MONGO_DB_NAME is required}
      DOMAIN: ${DOMAIN:-https://jrycho.cz}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SMTP_HOST: ${SMTP_HOST:-smtp.cesky-hosting.cz}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-tls}
      SMTP_USER: ${SMTP_USER:-noreply@jrycho.cz}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@jrycho.cz}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Jrycho}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://dproject-frontend.onrender.com,https://jrycho.cz,https://www.jrycho.cz}
      OFF_API_BASE_URL: ${OFF_API_BASE_URL:-https://world.openfoodfacts.org}
    restart: unless-stopped
